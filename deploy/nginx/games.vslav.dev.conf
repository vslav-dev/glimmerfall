# /etc/nginx/sites-available/games  (symlink in sites-enabled)
# games.vslav.dev: one path per game. /var/www/games/<game> is a symlink to that game's live release,
# so `root` serves every game as plain files under its own path.

# Telemetry is public by nature (anyone can open the game): a per-IP limit keeps junk bounded.
limit_req_zone $binary_remote_addr zone=glimmerfall_ingest:1m rate=2r/s;

server {
    listen 80;
    server_name games.vslav.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name games.vslav.dev;

    ssl_certificate /etc/letsencrypt/live/games.vslav.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.vslav.dev/privkey.pem;

    # /var/www/games/glimmerfall -> /var/www/glimmerfall/current (CI switches `current` atomically).
    root /var/www/games;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Only one game so far: the bare domain opens it.
    location = / {
        return 302 /glimmerfall/;
    }

    location = /glimmerfall {
        return 301 /glimmerfall/;
    }

    # Unhashed entry points: revalidated on every load, so a deploy is picked up immediately.
    location = /glimmerfall/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /glimmerfall/sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /glimmerfall/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles never change.
    location /glimmerfall/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Game telemetry → MegaApp ingest (megaback on this server, source `glimmerfall`).
    # The ingest key is added here from a server-only snippet; the game never carries it.
    # Snippet /etc/nginx/snippets/glimmerfall-ingest-key.conf: proxy_set_header X-Ingest-Key "<key>";
    location = /glimmerfall/api/ingest/glimmerfall {
        limit_req zone=glimmerfall_ingest burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 512k;
        # Native shells post from https://localhost / capacitor://localhost and must read the status.
        add_header Access-Control-Allow-Origin * always;
        include /etc/nginx/snippets/glimmerfall-ingest-key.conf;
        proxy_set_header Cookie "";
        proxy_pass http://127.0.0.1:3000/api/ingest/glimmerfall;
    }

    location /glimmerfall/ {
        try_files $uri $uri/ =404;
    }
}
